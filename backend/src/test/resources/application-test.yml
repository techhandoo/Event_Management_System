spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
  kafka:
    listener:
      missing-topics-fatal: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.eventmanager.kafka.event"
        spring.json.add.type.headers: false
  # Exclude Redis auto-configuration for tests (no Redis container in CI)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

app:
  jwt:
    secret: testSecretKeyForUnitTestsOnlyMustBe256BitsOrMoreForHS256Algorithm!!
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
    token-prefix: "Bearer "
    authorization-header: "Authorization"
  email:
    resend-api-key: re_placeholder
    from-address: noreply@eventry.app
    frontend-url: http://localhost:5173

logging:
  level:
    com.eventmanager: INFO
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
