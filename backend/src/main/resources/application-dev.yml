spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/eventry
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

logging:
  level:
    com.eventmanager: DEBUG
    org.springframework.security: DEBUG
