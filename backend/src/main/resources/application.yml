server:
  port: 8080

spring:
  application:
    name: eventry

  # ─── Datasource (PostgreSQL) ──────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/eventry
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # ─── JPA & Hibernate ─────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 30
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  # ─── Flyway ──────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ─── Kafka ───────────────────────────────────────────
  kafka:
    listener:
      missing-topics-fatal: false
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: eventry-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.eventmanager.kafka.event"
        spring.json.add.type.headers: false

  # ─── Redis ───────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  # ─── Jackson ─────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ─── Application Properties ─────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration-ms: 900000      # 15 minutes
    refresh-token-expiration-ms: 604800000  # 7 days
    token-prefix: "Bearer "
    authorization-header: "Authorization"
  email:
    resend-api-key: ${RESEND_API_KEY:re_placeholder}
    from-address: ${EMAIL_FROM:noreply@eventry.app}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}

# ─── Logging ────────────────────────────────────────────
logging:
  level:
    com.eventmanager: DEBUG
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ─── Actuator ───────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
