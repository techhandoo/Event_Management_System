  { id: 'events', label: 'Events', icon: '🎯' },
  { id: 'event-detail', label: 'Event Detail', icon: '📋' },
  { id: 'organizer', label: 'Organizer', icon: '📊' },
  { id: 'admin', label: 'Admin', icon: '🛡️' },
  { id: 'create-event', label: 'Create Event', icon: '➕' },
  { id: 'notifications', label: 'Notifications', icon: '🔔' },
  { id: 'dashboard', label: 'Dashboard', icon: '📈' },
  { id: 'search', label: 'Search', icon: '🔍' },
];

let activePage = 'events';

function renderNav() {
  const nav = document.getElementById('nav-buttons');
  nav.innerHTML = pages.map(p => 
    `<button onclick="showPage('${p.id}')" class="nav-btn px-3 py-1.5 rounded-lg text-sm font-medium transition ${p.id === activePage ? 'active' : 'text-gray-600 hover:bg-gray-100'}">${p.icon} ${p.label}</button>`
  ).join('');
}

function showPage(id) {
  activePage = id;
  renderNav();
  const content = document.getElementById('content');
  content.innerHTML = pages.find(p => p.id === id)?.render() || '';
  content.classList.remove('fade-in');
  void content.offsetWidth;
  content.classList.add('fade-in');
}
